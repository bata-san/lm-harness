[project]
name = "llm-harness"
version = "0.1.0"
description = "Unified harness for local LLM runtimes (llama.cpp / Ollama / vLLM) on WSL2"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "psutil>=6.0",
  "pydantic>=2.7",
]

[project.scripts]
llm-harness = "harness.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness*"]
